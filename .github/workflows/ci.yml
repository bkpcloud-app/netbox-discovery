name: netbox-discovery-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        run: python3 --version

      - name: Version sync
        run: |
          test "$(cat VERSION)" = "$(cat netbox-discovery/VERSION)"
          test "$(cat VERSION)" = "1.11.26"

      - name: Documentation sync
        run: |
          V="$(cat VERSION)"
          FAMILY="$(echo "$V" | awk -F. '{print $1"."$2"."}')"
          test -f "docs/PATCH-$V.md"
          grep -Fq "# netbox-discovery $V" "docs/PATCH-$V.md"
          grep -Fq "$FAMILY" README.md
          grep -Fq "$FAMILY" docs/MANUAL.md
          grep -Fq "$FAMILY" docs/COMANDOS-RAPIDOS.md
          grep -Fq "$FAMILY" docs/HOMOLOGACAO.md
          grep -Fq "$FAMILY" RELEASE-NOTES.md
          grep -Fq "$FAMILY" SECURITY.md

      - name: Shell syntax
        run: |
          bash -n bootstrap.sh
          bash -n install.sh
          bash -n install-from-github.sh
          bash -n netbox-discovery/bin/netbox-discovery
          bash -n netbox-discovery/bin/netbox-discovery-wrapper

      - name: Python compile
        run: python3 -m compileall -q netbox-discovery tests

      - name: Product self-test
        run: python3 netbox-discovery/modules/product/selftest.py --base "$PWD/netbox-discovery" --package-root "$PWD"

      - name: Legacy regressions
        run: python3 tests/run_regressions_1_10.py

      - name: Hypervisor 1.10 regressions
        run: python3 tests/test_hypervisor_1_10.py

      - name: Hypervisor 1.10.6 preflight regressions
        run: python3 tests/test_hypervisor_1_10_6.py

      - name: Hypervisor 1.10.7 cluster migration regressions
        run: python3 tests/test_hypervisor_1_10_7.py

      - name: Hypervisor 1.10.8 VM site/parent regressions
        run: python3 tests/test_hypervisor_1_10_8.py

      - name: Hypervisor 1.11.25 VM parent-site inheritance
        run: python3 tests/test_hypervisor_1_11_25.py

      - name: Hypervisor 1.11.26 READY NOOP parent-site inheritance
        run: python3 tests/test_hypervisor_1_11_26.py

      - name: Network 1.10.9 PLAN diagnostics
        run: python3 tests/test_network_1_10_9.py

      - name: Network 1.10.10 ownership and Dell switches
        run: python3 tests/test_network_1_10_10.py

      - name: Network 1.10.11 PowerVault FA-MIB
        run: python3 tests/test_network_1_10_11.py

      - name: Network 1.10.12 identity anti-flap
        run: python3 tests/test_network_1_10_12.py

      - name: Network 1.10.13 IP delegation precedence
        run: python3 tests/test_network_1_10_13.py

      - name: Network 1.10.14 finalization
        run: python3 tests/test_network_1_10_14.py

      - name: Network 1.10.15 final fix
        run: python3 tests/test_network_1_10_15.py

      - name: Network 1.10.16 single-interface VM repair
        run: python3 tests/test_network_1_10_16.py

      - name: Network 1.10.17 zero-interface VM repair
        run: python3 tests/test_network_1_10_17.py

      - name: Network 1.10.18 primary-IP reassignment order
        run: python3 tests/test_network_1_10_18.py

      - name: Network 1.10.19 identity quality
        run: python3 tests/test_network_1_10_19.py

      - name: Network 1.11 consolidated identity and safety
        run: python3 tests/test_network_1_11_0.py

      - name: Network 1.11.2 Windows and serial quality
        run: python3 tests/test_network_1_11_2.py

      - name: Network 1.11.3 planner prerequisite shapes
        run: python3 tests/test_network_1_11_3.py

      - name: Network 1.11.4 linked inventory stages
        run: python3 tests/test_network_1_11_4.py

      - name: Network 1.11.5 planner direct entrypoint
        run: python3 tests/test_network_1_11_5.py

      - name: Network 1.11.6 identity safety
        run: python3 tests/test_network_1_11_6.py

      - name: Network 1.11.7 30-point identity audit
        run: python3 tests/test_network_1_11_7.py

      - name: Network 1.11.8 post-apply corrections
        run: python3 tests/test_network_1_11_8.py

      - name: Network 1.11.9 switch recovery
        run: python3 tests/test_network_1_11_9.py

      - name: Network 1.11.10 import/audit idempotency
        run: python3 tests/test_network_1_11_10.py

      - name: Network 1.11.11 scheduler migration
        run: python3 tests/test_network_1_11_11.py

      - name: Network 1.11.12 large-CIDR discovery
        run: python3 tests/test_network_1_11_12.py

      - name: Network 1.11.13 Discovery V6 entrypoints
        run: python3 tests/test_network_1_11_13.py

      - name: Network 1.11.14 scheduler auto-update and docs
        run: python3 tests/test_network_1_11_14.py

      - name: Network 1.11.15 update before scheduled run
        run: python3 tests/test_network_1_11_15.py

      - name: Network 1.11.16 native PLAN reports
        run: python3 tests/test_network_1_11_16.py

      - name: Network 1.11.17 final write guard
        run: python3 tests/test_network_1_11_17.py

      - name: Network 1.11.18 small-site bootstrap guard
        run: python3 tests/test_network_1_11_18.py

      - name: Network 1.11.19 final stable identity guard
        run: python3 tests/test_network_1_11_19.py

      - name: Network 1.11.20 global MAC ownership preflight
        run: python3 tests/test_network_1_11_20.py

      - name: Network 1.11.21 legacy MAC owner preflight
        run: python3 tests/test_network_1_11_21.py

      - name: Network 1.11.22 runtime MAC interface reuse
        run: python3 tests/test_network_1_11_22.py

      - name: Network 1.11.23 native go-live
        run: python3 tests/test_network_1_11_23.py

      - name: Network 1.11.24 initial-site bootstrap guard
        run: python3 tests/test_network_1_11_24.py

      - name: Secret sanity check
        run: |
          ! grep -RIE --exclude-dir=.git --exclude='*.md' '(password|passwd|secret|token)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{8,}["'"']' netbox-discovery || false
